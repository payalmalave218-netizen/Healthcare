{% extends "base.html" %}

{% block title %}Login - HEALIX HOSPITAL{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <div class="login-icon">
                <img
                    src="https://cdn.phototourl.com/uploads/2026-02-17-3d0f12b2-784a-421b-9e78-f1a6f3c36939.jpg"
                    alt="HEALIX HOSPITAL Logo"
                    class="login-logo"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                >
                <i class="fas fa-hospital login-logo-fallback" style="display:none;"></i>
            </div>
            <h1>HEALIX HOSPITAL</h1>
            <p class="hospital-address">JSPM Chowk Adarsh Nagar, Hadapsar</p>
            <p>Sign in to access the portal</p>
        </div>
        
        {% if error %}
        <div class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i>
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" class="login-form">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> Username
                </label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
        
        <div class="login-footer">
            <p><i class="fas fa-info-circle"></i> Default credentials: admin / admin123</p>
        </div>
    </div>
</div>
{% endblock %}
