{% extends "base.html" %}

{% block title %}Edit Patient - HEALIX HOSPITAL{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1><i class="fas fa-edit"></i> Edit Patient</h1>
        <a href="{{ url_for('view_patient', patient_id=patient.id) }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>
    
    <div class="card">
        <div class="card-body">
            <form method="POST" class="patient-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name"><i class="fas fa-user"></i> First Name *</label>
                        <input type="text" id="first_name" name="first_name" value="{{ patient.first_name }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="last_name"><i class="fas fa-user"></i> Last Name *</label>
                        <input type="text" id="last_name" name="last_name" value="{{ patient.last_name }}" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="date_of_birth"><i class="fas fa-calendar"></i> Date of Birth *</label>
                        <input type="date" id="date_of_birth" name="date_of_birth" value="{{ patient.date_of_birth }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="gender"><i class="fas fa-venus-mars"></i> Gender *</label>
                        <select id="gender" name="gender" required>
                            <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone"><i class="fas fa-phone"></i> Phone</label>
                        <input type="tel" id="phone" name="phone" value="{{ patient.phone or '' }}">
                    </div>
                    
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="email" name="email" value="{{ patient.email or '' }}">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="address"><i class="fas fa-map-marker-alt"></i> Address</label>
                    <textarea id="address" name="address" rows="2">{{ patient.address or '' }}</textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="blood_group"><i class="fas fa-tint"></i> Blood Group</label>
                        <select id="blood_group" name="blood_group">
                            <option value="">Select Blood Group</option>
                            <option value="A+" {% if patient.blood_group == 'A+' %}selected{% endif %}>A+</option>
                            <option value="A-" {% if patient.blood_group == 'A-' %}selected{% endif %}>A-</option>
                            <option value="B+" {% if patient.blood_group == 'B+' %}selected{% endif %}>B+</option>
                            <option value="B-" {% if patient.blood_group == 'B-' %}selected{% endif %}>B-</option>
                            <option value="AB+" {% if patient.blood_group == 'AB+' %}selected{% endif %}>AB+</option>
                            <option value="AB-" {% if patient.blood_group == 'AB-' %}selected{% endif %}>AB-</option>
                            <option value="O+" {% if patient.blood_group == 'O+' %}selected{% endif %}>O+</option>
                            <option value="O-" {% if patient.blood_group == 'O-' %}selected{% endif %}>O-</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="emergency_contact_name"><i class="fas fa-user-friends"></i> Emergency Contact Name</label>
                        <input type="text" id="emergency_contact_name" name="emergency_contact_name" value="{{ patient.emergency_contact_name or '' }}">
                    </div>
                    
                    <div class="form-group">
                        <label for="emergency_contact_phone"><i class="fas fa-phone-alt"></i> Emergency Contact Phone</label>
                        <input type="tel" id="emergency_contact_phone" name="emergency_contact_phone" value="{{ patient.emergency_contact_phone or '' }}">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="medical_history"><i class="fas fa-file-medical"></i> Medical History</label>
                    <textarea id="medical_history" name="medical_history" rows="4" placeholder="Enter any relevant medical history...">{{ patient.medical_history or '' }}</textarea>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Update Patient
                    </button>
                    <a href="{{ url_for('view_patient', patient_id=patient.id) }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
