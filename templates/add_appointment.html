{% extends "base.html" %}

{% block title %}Schedule Appointment - HEALIX HOSPITAL{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1><i class="fas fa-calendar-plus"></i> Schedule Appointment</h1>
        <a href="{{ url_for('appointments') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Appointments
        </a>
    </div>
    
    <div class="card">
        <div class="card-body">
            <form method="POST" class="patient-form">
                <div class="form-group">
                    <label for="patient_id"><i class="fas fa-user"></i> Patient *</label>
                    <select id="patient_id" name="patient_id" required>
                        <option value="">Select Patient</option>
                        {% for patient in patients %}
                        <option value="{{ patient.id }}">{{ patient.patient_id }} - {{ patient.first_name }} {{ patient.last_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="appointment_date"><i class="fas fa-calendar"></i> Appointment Date *</label>
                        <input type="date" id="appointment_date" name="appointment_date" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="appointment_time"><i class="fas fa-clock"></i> Appointment Time *</label>
                        <input type="time" id="appointment_time" name="appointment_time" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="doctor_name"><i class="fas fa-user-md"></i> Doctor Name</label>
                        <select id="doctor_name" name="doctor_name">
                            <option value="">Select Doctor</option>
                            <option value="Dr. Awari">Dr. Awari</option>
                            <option value="Dr. Pawade">Dr. Pawade</option>
                            <option value="Dr. Dere">Dr. Dere</option>
                            <option value="Dr. Kasbe">Dr. Kasbe</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="department"><i class="fas fa-building"></i> Department</label>
                        <select id="department" name="department">
                            <option value="">Select Department</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Neurology">Neurology</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="Pediatrics">Pediatrics</option>
                            <option value="General Medicine">General Medicine</option>
                            <option value="Dermatology">Dermatology</option>
                            <option value="Oncology">Oncology</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="reason"><i class="fas fa-stethoscope"></i> Reason for Visit</label>
                    <textarea id="reason" name="reason" rows="3" placeholder="Enter the reason for the appointment..."></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="status"><i class="fas fa-info-circle"></i> Status</label>
                        <select id="status" name="status">
                            <option value="scheduled">Scheduled</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>
                            <option value="rescheduled">Rescheduled</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="notes"><i class="fas fa-sticky-note"></i> Notes</label>
                    <textarea id="notes" name="notes" rows="3" placeholder="Additional notes..."></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Schedule Appointment
                    </button>
                    <a href="{{ url_for('appointments') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
